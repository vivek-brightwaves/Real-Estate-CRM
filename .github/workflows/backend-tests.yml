name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: crm_test
          MYSQL_USER: crm_test
          MYSQL_PASSWORD: test-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql+pymysql://crm_test:test-app-password@127.0.0.1:3306/crm_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      ENVIRONMENT: test
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      BACKEND_CORS_ORIGINS: http://localhost:3000
      SCHEDULER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Lint backend
        run: ruff check app tests scripts alembic

      - name: Scan application security
        run: bandit -q -r app scripts -x tests --severity-level medium

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Validate MySQL migrations
        run: alembic upgrade head

      - name: Run complete suite with coverage gate
        env:
          DATABASE_URL: sqlite:///./ci_runtime.sqlite
        run: python -m pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
