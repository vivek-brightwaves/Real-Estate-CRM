[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=90
markers =
    unit: isolated unit tests
    integration: multi-component integration tests
    api: HTTP API contract tests
    repository: database persistence and transaction tests
    service: service-layer behavior tests
